<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ben | Portfolio</title>
  <link rel="stylesheet" href="style.css">

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <canvas id="bg"></canvas>

  <nav>
    <h2>Ben.dev</h2>
    <div>
      <button onclick="toggleTheme()">🌙</button>

  <section id="projects">

    <div class="cards">

      <div class="card fade-in">

        <p>Cool description.</p>
        <div class="buttons">
          <a href="#" target="_blank">Live</a>
          <a href="#" target="_blank">GitHub</a>
        </div>
      </div>

      <div class="card fade-in">
        <h3>Project Two</h3>
        <p>Another project.</p>
        <div class="buttons">
          <a href="#">Live</a>
          <a href="#">GitHub</a>
        </div>
      </div>

    </div>
  </section>

  <section class="contact fade-in">
    <h2>Contact</h2>
    <p>Email: your@email.com</p>
  </section>

  <script src="script.js"></script>
</body>
</html>
